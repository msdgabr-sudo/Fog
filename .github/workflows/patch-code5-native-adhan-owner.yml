name: Final verify Code 5 Native Adhan owner

on:
  push:
    branches:
      - fix/code5-native-adhan-owner
    paths:
      - '.github/workflows/patch-code5-native-adhan-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify final publishable branch
        run: |
          set -euo pipefail
          grep -Fq "VERSION='qiblaastro-v5.74-native-adhan-owner-20260829'" source/service-worker.js
          grep -Fq "OFFLINE_RELEASE='native-adhan-owner-20260829'" source/service-worker.js
          grep -Fq "node tests/code5-native-adhan-owner.test.js" .github/workflows/deploy-app-pages.yml
          (cd source && node tests/code5-native-adhan-owner.test.js)
          (cd source && node tests/code5-background-adhan-web-gate.test.js)
          (cd source && node tests/native-token-fragment-compatibility.test.js)
          (cd source && node tests/permissions-gnss-adhan-cycle.test.js)
          (cd source && node tests/adhan-runtime-resilience.test.js)
          (cd source && node tests/prayer-midnight-refresh.test.js)
          (cd source && node tests/code3-web-cutover-compatibility.test.js)
          (cd source && node tests/offline-complete-shell.test.js)
          (cd source && node tests/offline-network-fallback.test.js)
          (cd source && node tests/pwa-standalone-readiness.test.js)
          (cd source && node tests/android-release-version.test.js)
          (cd source && python3 android-twa/test_native_integrations.py)
