name: Patch Code 5 rich widget summary safely

on:
  push:
    branches:
      - fix/code5-widget-rich-summary
    paths:
      - '.github/workflows/patch-code5-widget-rich-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact guarded Web-only widget patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          sync='source/js/presentation/prayer/schedule-sync.js'
          old="function minuteFor(name){try{var schedule=prayerSchedule(),p=schedule?schedule.find(function(x){return x&&x.n===name;}):null;if(!p||!Number.isFinite(Number(p.h)))return -1;return ((Math.round(Number(p.h)*60)%1440)+1440)%1440;}catch(_){return -1;}}"
          new=old+"\nfunction cleanWidgetText(value){return String(value||'').replace(/[\\u0000-\\u001F\\u007F]/g,' ').replace(/\\s+/g,' ').trim();}\nfunction widgetMinute(value){value=Number(value);if(!Number.isFinite(value)||value<0||value>=1440)return'--:--';var h=Math.floor(value/60),m=Math.floor(value%60);return(h<10?'0':'')+h+':'+(m<10?'0':'')+m;}\nfunction widgetGregorianDate(timeZone){try{return cleanWidgetText(new Intl.DateTimeFormat('ar-EG-u-nu-latn',{weekday:'short',day:'numeric',month:'short',timeZone:timeZone||undefined}).format(new Date()).replace(/،/g,''));}catch(_){return'';}}\nfunction widgetPresentation(payload,hijriOverride){payload=payload||{};var loc=payload.loc||{},times=payload.times||{},hijri='';if(hijriOverride!==undefined&&hijriOverride!==null)hijri=cleanWidgetText(hijriOverride);else try{var h=root.document&&root.document.getElementById('pr-h');hijri=cleanWidgetText(h&&h.textContent?h.textContent:'');}catch(_){}var gregorian=widgetGregorianDate(payload.plan&&payload.plan.timeZone||loc.timeZone||'');var clocks='فج'+widgetMinute(times.fajr)+' · ظه'+widgetMinute(times.dhuhr)+' · عص'+widgetMinute(times.asr)+' · مغ'+widgetMinute(times.maghrib)+' · عش'+widgetMinute(times.isha);var datePart=[gregorian,hijri].filter(Boolean).join(' • '),separator=datePart?' • ':'',allowed=Math.max(0,80-separator.length-clocks.length);if(datePart.length>allowed){datePart=datePart.slice(0,allowed).replace(/\\s+\\S*$/,'').replace(/[•·\\s]+$/,'');}var summary=(datePart?datePart+' • ':'')+clocks;if(summary.length>80)summary=clocks.slice(0,80);return{city:cleanWidgetText(loc.label||'').slice(0,80),summary:summary};}"
          replace_exact(sync,old,new)

          replace_exact(sync,
              "q.set('city',loc.label||'');q.set('tz',payload.plan.timeZone||loc.timeZone||Intl.DateTimeFormat().resolvedOptions().timeZone||'');q.set('plan',payload.planText);var h=root.document&&root.document.getElementById('pr-h');q.set('hijri',h&&h.textContent?h.textContent:'');",
              "var widget=widgetPresentation(payload);q.set('city',widget.city);q.set('tz',payload.plan.timeZone||loc.timeZone||Intl.DateTimeFormat().resolvedOptions().timeZone||'');q.set('plan',payload.planText);q.set('hijri',widget.summary);")

          replace_exact(sync,
              "root.QiblaPrayerNativeSync=Object.freeze({sync:explicitSync,syncWidget:widgetSync,refresh:maybeNativeSync,refreshWidget:maybeWidgetSync,captureToken:captureToken});",
              "root.QiblaPrayerNativeSync=Object.freeze({sync:explicitSync,syncWidget:widgetSync,refresh:maybeNativeSync,refreshWidget:maybeWidgetSync,captureToken:captureToken,widgetPreview:widgetPresentation});")

          replace_exact('source/js/presentation/bootstrap.js',
              "js/presentation/prayer/schedule-sync.js?v=20260829-foreground2",
              "js/presentation/prayer/schedule-sync.js?v=20260829-widget-rich1")
      - name: Verify Code 5 safety gates
        working-directory: source
        run: |
          set -euo pipefail
          node tests/code5-widget-rich-summary.test.js
          node tests/code5-background-adhan-web-gate.test.js
          node tests/code3-web-cutover-compatibility.test.js
          node tests/prayer-midnight-refresh.test.js
          node tests/offline-complete-shell.test.js
          node tests/offline-network-fallback.test.js
          node tests/android-release-version.test.js
      - name: Commit guarded patch
        run: |
          set -euo pipefail
          git config user.name 'msdgabr-sudo'
          git config user.email 'm.sd.gabr@gmail.com'
          git add source/js/presentation/prayer/schedule-sync.js source/js/presentation/bootstrap.js
          git diff --cached --quiet && { echo 'No patch changes to commit'; exit 1; }
          git commit -m 'Enrich Code 5 widget with dates and daily prayer times'
          git push origin HEAD:fix/code5-widget-rich-summary
