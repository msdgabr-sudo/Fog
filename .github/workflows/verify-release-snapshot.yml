name: Verify current Android release snapshot

# CURRENT ANDROID RELEASE PROOF GATE
# ----------------------------------
# Fog/main is authoritative. release-config.json owns current release identity.
# This workflow verifies the exact triggering commit and builds an unsigned AAB
# proof only. It never signs. The frozen signed-Code5 proof script remains
# intentionally pinned to its already-approved artifact hash and source commit.

on:
  push:
    branches:
      - main
    paths:
      - 'source/android-twa/**'
      - 'source/tests/**'
      - 'source/tools/**'
      - 'source/.release-source-sha'
      - 'release-config.json'
      - '.github/workflows/verify-release-snapshot.yml'
      - 'build-final-signed-aab.ps1'
      - 'sign-verified-code5-aab.ps1'
      - 'RELEASE_SOURCE.md'
      - 'REPOSITORY_STATE.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  HISTORICAL_SOURCE_SHA: 6e49775df5742413371a4165ea985173c43f5f5e
  BUBBLEWRAP_IMAGE: ghcr.io/googlechromelabs/bubblewrap@sha256:01b3d5cdcdb670edd8ee00654c36f978896da78dfd7cc7e62814b83268c6f53b

jobs:
  windows-release-script-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout exact triggering Fog snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Parse current guarded Windows release scripts with PowerShell AST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            '.\sign-verified-code5-aab.ps1',
            '.\build-final-signed-aab.ps1'
          )
          foreach ($script in $scripts) {
            if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
              throw "Required Windows release script missing: $script"
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.Text,$_.Message) }
              throw "PowerShell syntax errors found in $script"
            }
            Write-Host "PASS: PowerShell syntax $script"
          }

  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering Fog snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Load authoritative release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 source/tools/verify_release_config.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release=json.loads(Path('release-config.json').read_text(encoding='utf-8'))
          artifacts=release['artifacts']
          android=release['android']
          values={
              'AAB_FILENAME': artifacts['unsignedAab'],
              'AAB_ARTIFACT_NAME': artifacts['unsignedAabProofName'],
              'RELEASE_VERSION_NAME': android['versionName'],
              'RELEASE_VERSION_CODE': android['versionCode'],
              'RELEASE_PACKAGE_ID': android['packageId'],
              'RELEASE_TARGET_SDK': android['targetSdkVersion'],
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              for key,value in values.items():
                  handle.write(f'{key}={value}\n')
          PY

      - name: Verify historical provenance marker and absence of secrets
        run: |
          set -euo pipefail
          test -f source/.release-source-sha
          test "$(tr -d '\r\n' < source/.release-source-sha)" = "$HISTORICAL_SOURCE_SHA"
          if find source -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*service-account*.json' \) -print -quit | grep -q .; then
            echo 'ERROR: secret material is forbidden in the release repository.' >&2
            exit 1
          fi
          echo 'Historical provenance marker verified. Triggering Fog commit remains authoritative.'

      - name: Run current release-source gates
        working-directory: source
        run: |
          set -euo pipefail
          python3 tools/pre_apk_check.py
          python3 android-twa/check_twa_config.py
          python3 tools/run_release_test_suite.py --profile android

      - name: Pull pinned Bubblewrap toolchain
        run: docker pull "$BUBBLEWRAP_IMAGE"

      - name: Generate Android project from current TWA manifest
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/source/android-twa:/app" -w /app "$BUBBLEWRAP_IMAGE" update --manifest twa-manifest.json --skipVersionUpgrade
          sudo chown -R "$(id -u):$(id -g)" source/android-twa
          test -x source/android-twa/gradlew
          test -f source/android-twa/app/src/main/AndroidManifest.xml

      - name: Enforce target API and inject approved native features
        run: |
          set -euo pipefail
          python3 source/android-twa/ensure_target_api_36.py
          python3 source/android-twa/apply_native_integrations.py --all
          python3 source/android-twa/check_generated_release_identity.py
          python3 source/android-twa/check_release_integration.py
          (cd source && node tests/native-android-localization-security.test.js)

      - name: Build unsigned current release AAB
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash -v "$PWD/source/android-twa:/app" -w /app "$BUBBLEWRAP_IMAGE" -lc '
            set -euo pipefail
            CFG=/root/.bubblewrap/config.json
            export JAVA_HOME=$(node -p "require(\"$CFG\").jdkPath")
            export ANDROID_HOME=$(node -p "require(\"$CFG\").androidSdkPath")
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -1)
            test -n "$SDKMANAGER"
            export PATH="$JAVA_HOME/bin:$(dirname "$SDKMANAGER"):$ANDROID_HOME/platform-tools:$PATH"
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0"
            ./gradlew --no-daemon :app:processReleaseMainManifest
            python3 check_generated_permissions.py
            bubblewrap build --skipSigning --skipPwaValidation --manifest=twa-manifest.json
          '
          sudo chown -R "$(id -u):$(id -g)" source/android-twa

      - name: Verify and stage unsigned AAB proof
        run: |
          set -euo pipefail
          CANDIDATE=''
          for f in \
            source/android-twa/app/build/outputs/bundle/release/app-release.aab \
            source/android-twa/app-release-bundle.aab; do
            if [ -s "$f" ]; then CANDIDATE="$f"; break; fi
          done
          test -n "$CANDIDATE"
          mkdir -p dist
          cp "$CANDIDATE" "dist/$AAB_FILENAME"
          python3 source/android-twa/check_aab_release.py "dist/$AAB_FILENAME"
          sha256sum "dist/$AAB_FILENAME" | tee "dist/$AAB_FILENAME.sha256"

      - name: Upload unsigned AAB proof artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.AAB_ARTIFACT_NAME }}
          path: |
            dist/${{ env.AAB_FILENAME }}
            dist/${{ env.AAB_FILENAME }}.sha256
          if-no-files-found: error
          retention-days: 14
