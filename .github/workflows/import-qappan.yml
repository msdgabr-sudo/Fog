name: Import q-app-an snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-qappan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the locked source snapshot
        run: |
          git clone --branch main --single-branch --no-tags https://github.com/msdgabr-sudo/q-app-an.git /tmp/qapp-source
          git -C /tmp/qapp-source checkout c38eaf03a9fcfd9fd8197a0865cd4ff4f927cbac
          test "$(git -C /tmp/qapp-source rev-parse HEAD)" = "c38eaf03a9fcfd9fd8197a0865cd4ff4f927cbac"

      - name: Replace Fog contents except protected workflow files
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/' /tmp/qapp-source/ ./
          test -e .github/workflows/import-qappan.yml

      - name: Verify and publish ordinary source files
        run: |
          test "$(git -C /tmp/qapp-source rev-parse HEAD)" = "c38eaf03a9fcfd9fd8197a0865cd4ff4f927cbac"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import q-app-an snapshot c38eaf03"
          git push origin HEAD:main
