name: Verify Azkar native bridge hotfix

on:
  push:
    branches:
      - fix/azkar-top-native-bridge
    paths:
      - 'source/**'
      - '.github/workflows/verify-azkar-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact hotfix commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Azkar bridge and release safety
        working-directory: source
        run: |
          set -euo pipefail
          node tests/azkar-native-top-bridge.test.js
          node tests/azkar-web-reminder-runtime.test.js
          node tests/presentation/azkar-single-owner.test.js
          node tests/code3-web-cutover-compatibility.test.js
          node tests/offline-complete-shell.test.js
          node tests/offline-network-fallback.test.js
          node tests/android-release-version.test.js
          python3 android-twa/test_native_integrations.py
