name: Deploy app.qiblalabs.com

# Production web release gate.
# Every source change must pass the core scientific/runtime/offline suite before
# GitHub Pages can deploy. Pull requests run verification only; they never deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - 'release-config.json'
      - '.github/workflows/deploy-app-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'source/**'
      - 'release-config.json'
      - '.github/workflows/deploy-app-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Production release gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate snapshot
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify single release configuration
        run: |
          set -euo pipefail
          python3 source/tools/verify_release_config.py

      - name: Verify standalone web release boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f source/index.html
          test -f source/manifest.json
          test -f source/service-worker.js
          test -f source/CNAME
          test -f source/.nojekyll
          test -f source/.well-known/assetlinks.json
          python3 source/tools/pre_apk_check.py
          python3 source/android-twa/check_twa_config.py
          grep -Fq "permissions-onboarding.js?v=20260819-code3-location-only1" source/js/presentation/bootstrap.js
          grep -Fq "qiblaastro:permissions-onboarding:v3-location-only" source/js/presentation/permissions-onboarding.js
          ! grep -Fq "prepareAdhanStage" source/js/presentation/permissions-onboarding.js
          test ! -e source/js/presentation/location-service-control.js
          ! grep -RIlE --exclude-dir='.git' 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|service_account|private_key_id' source >/dev/null
          if find source -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.pem' \) -print -quit | grep -q .; then
            echo 'ERROR: signing/private key material found in web release.' >&2
            exit 1
          fi

      - name: Run production scientific and runtime suite
        run: |
          set -euo pipefail
          python3 source/tools/run_release_test_suite.py --profile web

  deploy:
    name: Deploy verified GitHub Pages release
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified release snapshot
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
