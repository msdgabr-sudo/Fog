name: Verify native token fragment hotfix

on:
  push:
    branches:
      - fix/native-token-fragment-decode
    paths:
      - 'source/**'
      - '.github/workflows/verify-native-token-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact hotfix commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify native token, Adhan, Azkar and offline safety
        working-directory: source
        run: |
          set -euo pipefail
          node tests/native-token-fragment-compatibility.test.js
          node tests/azkar-native-top-bridge.test.js
          node tests/azkar-web-reminder-runtime.test.js
          node tests/adhan-runtime-resilience.test.js
          node tests/prayer-widget-safe-autosync.test.js
          node tests/permissions-gnss-adhan-cycle.test.js
          node tests/code3-web-cutover-compatibility.test.js
          node tests/offline-complete-shell.test.js
          node tests/offline-network-fallback.test.js
          node tests/android-release-version.test.js
          node tests/native-android-localization-security.test.js
          python3 android-twa/test_native_integrations.py
