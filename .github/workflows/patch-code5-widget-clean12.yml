name: Patch Code 5 clean 12-hour widget

on:
  push:
    branches:
      - fix/code5-widget-clean12
    paths:
      - '.github/workflows/patch-code5-widget-clean12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact Web-only widget cleanup
        shell: python
        run: |
          from pathlib import Path
          sync=Path('source/js/presentation/prayer/schedule-sync.js')
          text=sync.read_text(encoding='utf-8')
          old="function widgetPrayerRow(name,value){return '\\u200F'+name+' \\u200E'+widgetMinute(value);}\nfunction widgetPresentation(payload,hijriOverride){payload=payload||{};var loc=payload.loc||{},times=payload.times||{},hijri='';if(hijriOverride!==undefined&&hijriOverride!==null)hijri=cleanWidgetText(hijriOverride);else try{var h=root.document&&root.document.getElementById('pr-h');hijri=cleanWidgetText(h&&h.textContent?h.textContent:'');}catch(_){}var tz=payload.plan&&payload.plan.timeZone||loc.timeZone||'',city=widgetLocationLabel(loc),gregorian=widgetGregorianDate(tz),dateLine=[city,gregorian,widgetHijriShort(hijri)].filter(Boolean).join(' • ');if(dateLine.length>64)dateLine=dateLine.slice(0,64).replace(/[•·\\s]+$/,'');var rows=[widgetPrayerRow('الفجر',times.fajr),widgetPrayerRow('الظهر',times.dhuhr),widgetPrayerRow('العصر',times.asr),widgetPrayerRow('المغرب',times.maghrib),widgetPrayerRow('العشاء',times.isha)].join('\\u2028');if(rows.length>80)throw new Error('Widget prayer rows exceed native safeText limit');return{city:dateLine,summary:rows};}"
          new="function widgetMinute12(value){value=Number(value);if(!Number.isFinite(value)||value<0||value>=1440)return'--:--';var h=Math.floor(value/60),m=Math.floor(value%60),suffix=h<12?'ص':'م',h12=h%12||12;return h12+':'+(m<10?'0':'')+m+' '+suffix;}\nfunction widgetPrayerItem(name,value){return name+' '+widgetMinute12(value);}\nfunction widgetPresentation(payload,hijriOverride){payload=payload||{};var loc=payload.loc||{},times=payload.times||{},hijri='';if(hijriOverride!==undefined&&hijriOverride!==null)hijri=cleanWidgetText(hijriOverride);else try{var h=root.document&&root.document.getElementById('pr-h');hijri=cleanWidgetText(h&&h.textContent?h.textContent:'');}catch(_){}var tz=payload.plan&&payload.plan.timeZone||loc.timeZone||'',city=widgetLocationLabel(loc),gregorian=widgetGregorianDate(tz).replace(/^\\S+\\s+/,'').trim(),hijriShort=widgetHijriShort(hijri).replace(/\\s+144[0-9]$/,'').trim(),dateLine=[city,gregorian,hijriShort].filter(Boolean).join(' • ');if(dateLine.length>60)dateLine=dateLine.slice(0,60).replace(/[•·\\s]+$/,'');var summary=[widgetPrayerItem('الفجر',times.fajr),widgetPrayerItem('الظهر',times.dhuhr),widgetPrayerItem('العصر',times.asr),widgetPrayerItem('المغرب',times.maghrib),widgetPrayerItem('العشاء',times.isha)].join(' • ');if(summary.length>80)throw new Error('Widget prayer summary exceeds native safeText limit');return{city:dateLine,summary:summary};}"
          if text.count(old)!=1:
              raise SystemExit(f'expected one old widget formatter, found {text.count(old)}')
          sync.write_text(text.replace(old,new),encoding='utf-8')
          boot=Path('source/js/presentation/bootstrap.js')
          b=boot.read_text(encoding='utf-8')
          oldrev='js/presentation/prayer/schedule-sync.js?v=20260829-widget-rows2'
          newrev='js/presentation/prayer/schedule-sync.js?v=20260829-widget-clean12'
          if b.count(oldrev)!=1:
              raise SystemExit(f'bootstrap expected one old revision, found {b.count(oldrev)}')
          boot.write_text(b.replace(oldrev,newrev),encoding='utf-8')
      - name: Verify Code 5 safety gates
        working-directory: source
        run: |
          set -euo pipefail
          node tests/code5-widget-rich-summary.test.js
          node tests/code5-native-adhan-owner.test.js
          node tests/code5-background-adhan-web-gate.test.js
          node tests/code3-web-cutover-compatibility.test.js
          node tests/prayer-midnight-refresh.test.js
          node tests/azkar-web-reminder-runtime.test.js
          node tests/azkar-native-top-bridge.test.js
          node tests/offline-complete-shell.test.js
          node tests/offline-network-fallback.test.js
          node tests/android-release-version.test.js
      - name: Commit guarded patch
        run: |
          set -euo pipefail
          git config user.name 'msdgabr-sudo'
          git config user.email 'm.sd.gabr@gmail.com'
          git add source/js/presentation/prayer/schedule-sync.js source/js/presentation/bootstrap.js
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m 'Polish Code 5 widget with clean 12-hour prayer summary'
          git push origin HEAD:fix/code5-widget-clean12
